#:schema node_modules/wrangler/config-schema.json
name = "monthmemo"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The SPA (apps/web build) is served from the same origin; API, auth, unsubscribe and dev routes hit the Worker first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/dev/*", "/paddle/*", "/u/*", "/app", "/app/*", "/sign-in"]

# Per-minute limit on auth writes (the binding only supports 10 s or 60 s windows). Unsubscribe posts use D1.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "monthmemo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# One trigger for every job (the Free plan has 5 per account); src/index.ts picks the job from the tick time.
# The monthly run starts on the 4th at 06:00 UTC because Search Console lags 2-3 days.
[triggers]
crons = ["* * * * *"]

# Secrets, set with `wrangler secret put <NAME> --env production` (locally in .dev.vars):
#   BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GROQ_API_KEY, BREVO_API_KEY,
#   PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, TURNSTILE_SECRET_KEY
# Local defaults below; `--env production` uses the block at the end.
[vars]
APP_URL = "http://localhost:8787"
MAIL_FROM = "MonthMemo <reports@monthmemo.example>"
DEV_ROUTES = "0"
GOOGLE_FAKE = "0"
PADDLE_ENV = "sandbox"
PADDLE_CLIENT_TOKEN = ""
PADDLE_PRICE_STARTER = "pri_starter_example"
PADDLE_PRICE_GROWTH = "pri_growth_example"
LLM_DAILY_USD_CAP = "5"
LLM_AGENCY_DAILY_USD_CAP = "0.10"
OWNER_ALERT_EMAIL = "owner@monthmemo.example"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Production: `wrangler deploy --env production`. Bindings aren't inherited, so they are repeated here.
[env.production]
name = "monthmemo"
routes = [{ pattern = "monthmemo.spacesonlabs.com", custom_domain = true }]
# The product domain is the only public origin: no workers.dev or preview URLs.
workers_dev = false
preview_urls = false

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/dev/*", "/paddle/*", "/u/*", "/app", "/app/*", "/sign-in"]

[[env.production.ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

[[env.production.d1_databases]]
binding = "DB"
database_name = "monthmemo"
database_id = "7f4b7ac7-7ff8-4c0c-9ea6-cbbc8dd4f92c"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["* * * * *"]

[env.production.vars]
APP_URL = "https://monthmemo.spacesonlabs.com"
MAIL_FROM = "MonthMemo <monthmemo@mail.spacesonlabs.com>"
DEV_ROUTES = "0"
GOOGLE_FAKE = "0"
PADDLE_ENV = "production"
PADDLE_CLIENT_TOKEN = "REPLACE_WITH_PADDLE_CLIENT_TOKEN"
PADDLE_PRICE_STARTER = "REPLACE_WITH_PRICE_ID"
PADDLE_PRICE_GROWTH = "REPLACE_WITH_PRICE_ID"
LLM_DAILY_USD_CAP = "5"
LLM_AGENCY_DAILY_USD_CAP = "0.10"
OWNER_ALERT_EMAIL = "alerts@spacesonlabs.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAGMNQbNPf4Fg2x5x"
